<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ff7a00">
<title>RMDtxtML</title>
<link rel="stylesheet" href="./app.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<div class="app">
  <header class="top">
    <button id="back" aria-label="Fechar">‹</button>
    <div class="brand"><b>RMDtxtML</b><small>Telegram Rich Message · Bot API 10.3</small></div>
    <button class="send" id="send">Enviar</button>
  </header>
  <nav class="bar" aria-label="Formatação">
    <select id="block" aria-label="Tipo de bloco">
      <option value="p">Texto</option><option value="h1">H1</option><option value="h2">H2</option><option value="h3">H3</option><option value="h4">H4</option><option value="h5">H5</option><option value="h6">H6</option><option value="footer">Rodapé</option>
    </select>
    <button data-cmd="bold" title="Negrito">B</button><button data-cmd="italic" title="Itálico"><i>I</i></button><button data-cmd="underline" title="Sublinhado"><u>U</u></button><button data-cmd="strikeThrough" title="Riscado"><s>S</s></button>
    <button id="mark" title="Destaque">▣</button><button id="spoiler" title="Spoiler">◧</button>
    <span class="sep"></span><button id="link" title="Link">↗</button><button id="code" title="Código">&lt;/&gt;</button>
    <span class="sep"></span><button data-cmd="undo" title="Desfazer">↶</button><button data-cmd="redo" title="Refazer">↷</button><button id="more" title="Mais recursos">＋</button>
  </nav>
  <main class="work">
    <div class="scroll" id="editWrap"><article id="editor" class="editor" contenteditable="true" spellcheck="true"><h2>RMDtxtML</h2><p>Crie uma <strong>Rich Message</strong> usando Rich HTML da Bot API 10.3.</p><blockquote>Edite visualmente, visualize e publique pelo bot.</blockquote></article></div>
    <div class="scroll previewWrap" id="previewWrap"><section class="preview"><span class="tag">Rich Message · HTML</span><div id="preview"></div></section></div>
  </main>
  <footer class="bottom"><button id="previewBtn" title="Prévia">◉</button><div id="status" class="status">Inicializando…</div><button id="save">Salvar</button></footer>
</div>

<div class="drawer" id="drawer">
  <aside class="sheet">
    <div class="sheetHead"><strong>Recursos Rich Message</strong><button id="close" aria-label="Fechar">×</button></div>
    <section class="group"><div class="groupTitle">Estrutura</div><div class="grid">
      <button data-action="ul"><b>Marcadores</b><small>Lista simples</small></button><button data-action="ol"><b>Numerada</b><small>Lista ordenada</small></button><button data-action="task"><b>Tarefas</b><small>Checkboxes</small></button>
      <button data-action="quote"><b>Citação</b><small>Block quote</small></button><button data-action="expandable"><b>Citação expansível</b><small>Recolhível</small></button><button data-action="pullquote"><b>Pull quote</b><small>Trecho em destaque</small></button>
      <button data-action="details"><b>Detalhes</b><small>Bloco recolhível</small></button><button data-action="pre"><b>Pré-formatado</b><small>Bloco de código</small></button><button data-action="divider"><b>Divisor</b><small>Linha horizontal</small></button>
      <button data-action="table"><b>Tabela</b><small>Até 20 colunas</small></button><button data-action="math"><b>Fórmula inline</b><small>LaTeX</small></button><button data-action="mathblock"><b>Fórmula em bloco</b><small>LaTeX</small></button>
    </div></section>
    <section class="group"><div class="groupTitle">Mídia e localização</div><div class="grid">
      <button data-action="image"><b>Imagem</b><small>URL HTTPS</small></button><button data-action="video"><b>Vídeo</b><small>URL HTTPS</small></button><button data-action="audio"><b>Áudio</b><small>URL HTTPS</small></button>
      <button data-action="document"><b>Documento</b><small>Bot API 10.3</small></button><button data-action="map"><b>Mapa</b><small>Latitude e longitude</small></button><button data-action="collage"><b>Collage</b><small>Múltiplas mídias</small></button><button data-action="slideshow"><b>Slideshow</b><small>Sequência de mídias</small></button>
    </div></section>
    <section class="group"><div class="groupTitle">Rich text e interação</div><div class="grid">
      <button data-action="reference"><b>Referência</b><small>Nota referenciável</small></button><button data-action="anchor"><b>Âncora</b><small>Link interno</small></button><button data-action="time"><b>Data/hora</b><small>tg-time</small></button><button data-action="emoji"><b>Custom emoji</b><small>ID do Telegram</small></button><button data-action="button"><b>Botão</b><small>Rich Message button</small></button>
      <button data-action="rtl"><b>RTL</b><small id="rtlState">Desligado</small></button><button data-action="entities"><b>Detecção automática</b><small id="entityState">Ligada</small></button>
    </div></section>
    <section class="group"><div class="groupTitle">Documento</div><div class="grid">
      <button data-action="export"><b>Exportar</b><small>Rich HTML</small></button><button data-action="import"><b>Importar</b><small>Rich HTML</small></button><button data-action="server"><b>Servidor</b><small>Backend HTTPS</small></button><button class="danger" data-action="reset"><b>Limpar</b><small>Novo documento</small></button>
    </div></section>
  </aside>
</div>
<input id="file" type="file" accept="text/html,.html,.htm" hidden>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="./app.js"></script>
</body>
</html>
