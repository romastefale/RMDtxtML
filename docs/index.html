<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ff7a00">
<title>RMDtxtML</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:var(--tg-theme-bg-color,#fff);--panel:var(--tg-theme-secondary-bg-color,#f5f5f5);--text:var(--tg-theme-text-color,#111);--muted:var(--tg-theme-hint-color,#777);--accent:var(--tg-theme-button-color,#ff7a00);--accentText:var(--tg-theme-button-text-color,#fff);--line:color-mix(in srgb,var(--text) 13%,transparent)}*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;overflow:hidden}button,select,input{font:inherit;color:inherit}button{cursor:pointer}.app{height:100dvh;display:grid;grid-template-rows:auto auto 1fr auto}.top{display:grid;grid-template-columns:44px 1fr auto;align-items:center;min-height:58px;padding:max(8px,env(safe-area-inset-top)) 10px 7px;border-bottom:1px solid var(--line)}.brand{text-align:center;line-height:1.1}.brand b{display:block;letter-spacing:.08em}.brand small{color:var(--muted)}button{border:0;background:transparent;border-radius:11px;min-height:40px}.send{background:var(--accent);color:var(--accentText);font-weight:700;padding:0 14px}.bar{display:flex;gap:4px;align-items:center;overflow:auto;padding:7px;border-bottom:1px solid var(--line)}.bar::-webkit-scrollbar{display:none}.bar button{min-width:40px;font-weight:700}.bar button:hover,.bottom button:hover{background:var(--panel)}select{border:0;background:var(--panel);border-radius:10px;height:38px;padding:0 9px}.sep{width:1px;height:24px;background:var(--line);flex:none}.work{min-height:0;position:relative;overflow:hidden}.scroll{height:100%;overflow:auto;padding:20px 16px 100px}.editor,.preview{width:min(760px,100%);min-height:calc(100dvh - 230px);margin:auto;outline:0}.editor{caret-color:var(--accent)}.editor:empty:before{content:"Comece a escrever…";color:var(--muted)}blockquote{border-left:3px solid var(--accent);padding-left:12px;margin:14px 0}code,pre{background:var(--panel);border-radius:8px}code{padding:2px 5px}pre{padding:12px;overflow:auto}mark{background:color-mix(in srgb,var(--accent) 18%,transparent);color:inherit}table{border-collapse:collapse;width:100%;margin:14px 0}td,th{border:1px solid var(--line);padding:7px}th{background:var(--panel)}details{border:1px solid var(--line);padding:8px 10px;border-radius:10px;margin:12px 0}tg-spoiler{background:var(--text);color:transparent;border-radius:4px;padding:0 2px}tg-math,tg-math-block{font-family:ui-monospace,monospace}tg-math-block{display:block;background:var(--panel);padding:10px;border-radius:10px}.bottom{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:7px;border-top:1px solid var(--line);padding:7px 9px max(7px,env(safe-area-inset-bottom))}.status{min-width:0;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bottom button{padding:0 10px;color:var(--accent);font-weight:700}.drawer{position:fixed;inset:0;background:#0005;z-index:20;display:none}.drawer.open{display:block}.sheet{position:absolute;left:0;right:0;bottom:0;max-height:76dvh;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:10px 12px calc(14px + env(safe-area-inset-bottom))}.sheetHead{display:flex;justify-content:space-between;align-items:center}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}.grid button{background:var(--bg);border-radius:0;text-align:left;padding:10px 12px}.grid b{display:block}.grid small{display:block;color:var(--muted)}.previewWrap{display:none}.previewWrap.open{display:block}.preview{border:1px solid var(--line);border-radius:16px;padding:15px}.tag{display:inline-block;color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);border-radius:99px;padding:4px 8px;font-size:11px;font-weight:700;margin-bottom:10px}.toast{position:fixed;left:50%;bottom:80px;transform:translate(-50%,15px);background:var(--text);color:var(--bg);padding:8px 11px;border-radius:9px;opacity:0;pointer-events:none;transition:.16s;z-index:50}.toast.show{opacity:1;transform:translate(-50%,0)}@media(min-width:800px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style>
</head>
<body>
<div class="app">
<header class="top"><button id="back">‹</button><div class="brand"><b>RMDtxtML</b><small>Rich Message editor</small></div><button class="send" id="send">Enviar</button></header>
<nav class="bar"><select id="block"><option value="p">Texto</option><option value="h1">H1</option><option value="h2">H2</option><option value="h3">H3</option></select><button data-cmd="bold">B</button><button data-cmd="italic"><i>I</i></button><button data-cmd="underline"><u>U</u></button><button data-cmd="strikeThrough"><s>S</s></button><span class="sep"></span><button id="quote">❝</button><button id="link">↗</button><button id="code">&lt;/&gt;</button><span class="sep"></span><button data-cmd="undo">↶</button><button data-cmd="redo">↷</button><button id="more">＋</button></nav>
<main class="work"><div class="scroll" id="editWrap"><article id="editor" class="editor" contenteditable="true" spellcheck="true"><h2>RMDtxtML</h2><p>Crie uma <strong>Rich Message</strong> para o Telegram usando uma interface visual.</p><blockquote>O documento é mantido como Rich HTML.</blockquote></article></div><div class="scroll previewWrap" id="previewWrap"><section class="preview"><span class="tag">Rich Message · HTML</span><div id="preview"></div></section></div></main>
<footer class="bottom"><button id="previewBtn">◉</button><div id="status" class="status">Rascunho local</div><button id="save">Salvar</button></footer>
</div>
<div class="drawer" id="drawer"><aside class="sheet"><div class="sheetHead"><strong>Mais recursos</strong><button id="close">×</button></div><div class="grid"><button data-action="spoiler"><b>Spoiler</b><small>Ocultar trecho</small></button><button data-action="mark"><b>Marcar</b><small>Destaque</small></button><button data-action="ul"><b>Marcadores</b><small>Lista simples</small></button><button data-action="ol"><b>Numerada</b><small>Lista ordenada</small></button><button data-action="task"><b>Tarefas</b><small>Checkboxes</small></button><button data-action="details"><b>Detalhes</b><small>Bloco recolhível</small></button><button data-action="math"><b>Fórmula</b><small>LaTeX</small></button><button data-action="table"><b>Tabela</b><small>Linhas e colunas</small></button><button data-action="rtl"><b>RTL</b><small>Direção da escrita</small></button><button data-action="export"><b>Exportar</b><small>Rich HTML</small></button><button data-action="import"><b>Importar</b><small>Rich HTML</small></button><button data-action="server"><b>Servidor</b><small>URL do backend</small></button></div></aside></div>
<input id="file" type="file" accept="text/html,.html,.htm" hidden><div id="toast" class="toast" role="status"></div>
<script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];const ed=$('#editor'),status=$('#status'),drawer=$('#drawer'),toast=$('#toast');const KEY='rmdtxtml-draft-v1',APIKEY='rmdtxtml-api-v1',DEFAULT_API='https://rmdtxtml-api-production.up.railway.app';let rtl=false;
function say(s){toast.textContent=s;toast.classList.add('show');clearTimeout(say.t);say.t=setTimeout(()=>toast.classList.remove('show'),1800)}function dirty(){status.textContent='Alterações não salvas'}function exec(c,v=null){ed.focus();document.execCommand(c,false,v);dirty()}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function ins(h){ed.focus();document.execCommand('insertHTML',false,h);dirty()}function wrap(tag){ed.focus();const s=getSelection();if(!s.rangeCount||s.getRangeAt(0).collapsed)return say('Selecione um trecho');const r=s.getRangeAt(0),e=document.createElement(tag);try{r.surroundContents(e)}catch{e.append(r.extractContents());r.insertNode(e)}s.removeAllRanges();dirty()}
const allowed=new Set('A B STRONG I EM U INS S STRIKE DEL CODE PRE MARK SUB SUP TG-SPOILER H1 H2 H3 P HR UL OL LI INPUT BR BLOCKQUOTE IMG VIDEO AUDIO TG-DOCUMENT FIGURE FIGCAPTION TG-MAP TABLE THEAD TBODY TR TH TD DETAILS SUMMARY TG-MATH TG-MATH-BLOCK TG-BUTTON TG-BUTTON-ROW'.split(' '));function clean(html){const d=new DOMParser().parseFromString('<body>'+html+'</body>','text/html'),o=document.createElement('div');function cp(n){if(n.nodeType===3)return document.createTextNode(n.nodeValue||'');if(n.nodeType!==1)return document.createDocumentFragment();if(!allowed.has(n.tagName)){const f=document.createDocumentFragment();[...n.childNodes].forEach(x=>f.append(cp(x)));return f}const e=document.createElement(n.tagName.toLowerCase());for(const a of [...n.attributes]){const k=a.name.toLowerCase(),v=a.value;if(k.startsWith('on')||k==='style')continue;if(['href','src'].includes(k)&&!/^(https?:|tg:|mailto:|tel:)/i.test(v))continue;if(['href','src','class','type','checked','expandable','lat','long','zoom','bordered','compact','url','data','text','align','style'].includes(k))e.setAttribute(k,v)}[...n.childNodes].forEach(x=>e.append(cp(x)));return e}[...d.body.childNodes].forEach(n=>o.append(cp(n)));return o.innerHTML}function html(){return clean(ed.innerHTML).trim()}
$$('[data-cmd]').forEach(b=>b.onclick=()=>exec(b.dataset.cmd));$('#block').onchange=e=>exec('formatBlock',e.target.value);$('#quote').onclick=()=>exec('formatBlock','blockquote');$('#code').onclick=()=>wrap('code');$('#link').onclick=()=>{const text=getSelection()?.toString()||'Telegram',u=prompt('URL','https://t.me/');if(u&&/^(https?:|tg:|mailto:|tel:)/i.test(u))ins(`<a href="${esc(u)}">${esc(text||u)}</a>`)};$('#more').onclick=()=>drawer.classList.add('open');$('#close').onclick=()=>drawer.classList.remove('open');drawer.onclick=e=>{if(e.target===drawer)drawer.classList.remove('open')};
const act={spoiler:()=>wrap('tg-spoiler'),mark:()=>wrap('mark'),ul:()=>exec('insertUnorderedList'),ol:()=>exec('insertOrderedList'),task:()=>ins('<ul><li><input type="checkbox"> Tarefa</li></ul><p><br></p>'),details:()=>{const s=prompt('Resumo','Detalhes'),b=prompt('Conteúdo','Conteúdo recolhível.');if(s!==null&&b!==null)ins(`<details><summary>${esc(s)}</summary><p>${esc(b)}</p></details><p><br></p>`)},math:()=>{const x=prompt('LaTeX','E = mc^2');if(x)ins(`<tg-math-block>${esc(x)}</tg-math-block><p><br></p>`)},table:()=>{const r=Math.max(1,Math.min(20,+prompt('Linhas','3')||1)),c=Math.max(1,Math.min(20,+prompt('Colunas','3')||1));let h='<table bordered compact><tr>'+Array.from({length:c},(_,i)=>`<th>Cabeçalho ${i+1}</th>`).join('')+'</tr>';for(let y=1;y<r;y++)h+='<tr>'+Array.from({length:c},()=>'<td>Célula</td>').join('')+'</tr>';ins(h+'</table><p><br></p>')},rtl:()=>{rtl=!rtl;ed.dir=rtl?'rtl':'ltr';dirty()},export:()=>{const b=new Blob([html()],{type:'text/html'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='RMDtxtML-rich-message.html';a.click();URL.revokeObjectURL(u)},import:()=>$('#file').click(),server:()=>{const old=localStorage.getItem(APIKEY)||DEFAULT_API,u=prompt('URL HTTPS do backend',old);if(u!==null){localStorage.setItem(APIKEY,u.replace(/\/+$/,''));say('Servidor salvo')}}};$$('[data-action]').forEach(b=>b.onclick=()=>{drawer.classList.remove('open');act[b.dataset.action]?.()});
$('#file').onchange=async e=>{const f=e.target.files?.[0];if(f){ed.innerHTML=clean(await f.text());dirty();e.target.value=''}};$('#save').onclick=()=>{localStorage.setItem(KEY,JSON.stringify({h:html(),rtl}));status.textContent='Rascunho salvo';say('Salvo')};$('#previewBtn').onclick=()=>{const p=$('#previewWrap'),open=!p.classList.contains('open');if(open){$('#preview').innerHTML=html();$('#preview').dir=rtl?'rtl':'ltr'}p.classList.toggle('open',open);$('#editWrap').style.display=open?'none':'';$('#previewBtn').textContent=open?'✕':'◉';status.textContent=open?'Prévia local':'Rascunho local'};ed.oninput=dirty;ed.onpaste=e=>{const h=e.clipboardData?.getData('text/html');if(h){e.preventDefault();ins(clean(h))}};$('#back').onclick=()=>tg?.close?tg.close():history.back();
$('#send').onclick=async()=>{const api=(localStorage.getItem(APIKEY)||DEFAULT_API).replace(/\/+$/,'');if(!tg?.initData)return say('Abra pelo Telegram para enviar');const chatId=prompt('Destino',String(tg.initDataUnsafe?.user?.id||''));if(!chatId)return;status.textContent='Enviando…';try{const r=await fetch(api+'/api/send',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({initData:tg.initData,chatId,html:html(),isRtl:rtl})}),j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'Falha');status.textContent='Rich Message publicada';say('Mensagem enviada')}catch(e){status.textContent='Falha no envio';say(e.message||'Falha')}};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s?.h){ed.innerHTML=clean(s.h);rtl=s.rtl===true;ed.dir=rtl?'rtl':'ltr'}}catch{};
</script>
</body></html>
